<body class="page-menu">
    <main id="main">
        <section class="page-hero">
            <div class="container menu-hero">
                <div>
                    <p class="kicker">The juices</p>
                    <h1 class="page-hero__title">Pressed this week.</h1>
                    <p class="page-hero__lede">Small batches from whole fruit and greens. Every bottle is 16 fl oz, with no added sugar and nothing artificial.</p>
                </div>
                <div class="bottle-fan" data-fan aria-hidden="true"></div>
            </div>
        </section>

        <section class="section section--tight">
            <div class="container">
                <div class="juice-grid" data-menu></div>
            </div>
        </section>

        <section class="section section--tint">
            <div class="container">
                <div class="section-head" data-reveal>
                    <div>
                        <p class="kicker">Side by side</p>
                        <h2 class="section-title">What's in each bottle.</h2>
                        <p class="section-lede">Per 16 fl oz bottle. Tap a juice for the full nutrition label.</p>
                    </div>
                </div>
                <div class="compare" data-compare data-reveal></div>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="ways" data-ways></div>
            </div>
