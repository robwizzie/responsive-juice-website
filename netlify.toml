[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Previews and branch deploys point their share images at their own address, so a preview link
# shows the new cards before they're live. Production keeps the committed pages as they are.
[context.deploy-preview]
  command = "node scripts/bake-header.mjs --site \"$DEPLOY_PRIME_URL\""

[context.branch-deploy]
  command = "node scripts/bake-header.mjs --site \"$DEPLOY_PRIME_URL\""

[functions]
  node_bundler = "esbuild"
  # The menu defaults are shared with the browser; make sure they're bundled
  included_files = ["assets/js/shared/**"]
  # sharp ships a native binary, so it is installed alongside the functions instead of bundled
  external_node_modules = ["sharp"]

# Redirect rules are in the _redirects file.

# Images rarely change; let browsers reuse them for a week.
# (JS/CSS keep Netlify's default revalidation since their filenames aren't versioned.)
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
